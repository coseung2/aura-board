name: Deploy Oracle Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-production
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ github.sha }} on GitHub ARM64
    if: github.repository == 'coseung2/aura-board' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://build:build@127.0.0.1:9/aura_build
      DIRECT_URL: postgresql://build:build@127.0.0.1:9/aura_build
      AUTH_SECRET: build-only-not-a-runtime-secret
      NEXTAUTH_SECRET: build-only-not-a-runtime-secret
      NEXTAUTH_URL: https://aura-board.com
      PLAYTOKEN_JWT_SECRET: build-only-not-a-runtime-secret
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Setup Rust 1.95.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0

      - name: Build verified release artifact
        shell: bash
        run: bash infra/oracle/build-ci-artifact.sh "$GITHUB_SHA" "$RUNNER_TEMP/oracle-release"

      - name: Upload release artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oracle-release-${{ github.sha }}
          path: ${{ runner.temp }}/oracle-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  deploy:
    name: Deploy ${{ github.sha }}
    if: github.repository == 'coseung2/aura-board' && github.ref == 'refs/heads/main'
    needs: build
    environment: Production
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - aura-board-prod
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Verify deployment revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = "main" || test "$GITHUB_REF" = "refs/heads/main"

      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oracle-release-${{ github.sha }}
          path: .deploy-artifact

      - name: Verify artifact presence
        shell: bash
        run: |
          set -euo pipefail
          test -s .deploy-artifact/oracle-release.tar.gz
          test -s .deploy-artifact/oracle-release.tar.gz.sha256

      - name: Publish, switch, and verify production
        shell: bash
        run: sudo /usr/local/sbin/aura-board-deploy-release

      - name: Delete transient release artifact
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        run: |
          set -euo pipefail
          if [[ -z "$ARTIFACT_ID" ]]; then
            echo "No artifact id was produced" >&2
            exit 1
          fi
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request DELETE \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")
          if [[ "$status" != "204" && "$status" != "404" ]]; then
            echo "Artifact deletion failed with HTTP ${status}" >&2
            exit 1
          fi
