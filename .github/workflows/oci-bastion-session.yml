name: OCI Bastion Session Keeper

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/oci-bastion-session.yml
      - infra/oracle/renew-bastion-session.sh

permissions:
  contents: read

concurrency:
  group: oci-bastion-session-keeper
  cancel-in-progress: false

jobs:
  renew:
    name: Keep DevSpace Bastion session active
    if: github.repository == 'coseung2/aura-board' && github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - aura-board-prod
    timeout-minutes: 10

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Prepare DevSpace Bastion public key
        shell: bash
        env:
          DEVSPACE_BASTION_PUBLIC_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINu4u9bcaAugHGyhhmX5mTCgYqKsrJtOccLLurH99AoV aura-devspace-bastion
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/aura-bastion-session"
          printf '%s\n' "$DEVSPACE_BASTION_PUBLIC_KEY" > "$RUNNER_TEMP/aura-bastion-session/devspace.pub"
          chmod 0600 "$RUNNER_TEMP/aura-bastion-session/devspace.pub"

      - name: Keep Bastion endpoint SSH path open
        shell: bash
        env:
          BASTION_NAME: aura-board-devspace-bastion
        run: |
          set -euo pipefail
          instance_json=$(curl --fail --silent --show-error \
            --header 'Authorization: Bearer Oracle' \
            http://169.254.169.254/opc/v2/instance/)
          read -r compartment_id region < <(python3 -c '
          import json, sys
          value = json.load(sys.stdin)
          print(value["compartmentId"], value.get("canonicalRegionName") or value["region"])
          ' <<<"$instance_json")
          bastion_json=$(oci bastion bastion list \
            --auth instance_principal \
            --region "$region" \
            --compartment-id "$compartment_id" \
            --name "$BASTION_NAME" \
            --bastion-lifecycle-state ACTIVE \
            --all \
            --output json)
          bastion_id=$(python3 -c '
          import json, sys
          items = json.load(sys.stdin).get("data", [])
          if len(items) != 1:
              raise SystemExit("expected exactly one active Bastion")
          print(items[0]["id"])
          ' <<<"$bastion_json")
          bastion_detail=$(oci bastion bastion get \
            --auth instance_principal \
            --region "$region" \
            --bastion-id "$bastion_id" \
            --output json)
          endpoint_ip=$(python3 -c '
          import ipaddress, json, sys
          item = json.load(sys.stdin)["data"]
          value = ipaddress.ip_address(item["private-endpoint-ip-address"])
          if not value.is_private:
              raise SystemExit("Bastion endpoint must be private")
          print(value)
          ' <<<"$bastion_detail")
          sudo -n systemctl restart ssh.service
          if ! sudo -n iptables -C INPUT -p tcp -s "${endpoint_ip}/32" --dport 22 -j ACCEPT 2>/dev/null; then
            sudo -n iptables -I INPUT 1 -p tcp -s "${endpoint_ip}/32" --dport 22 -j ACCEPT
          fi
          sudo -n sh -c 'iptables-save > /etc/iptables/rules.v4'

      - name: Ensure an active OCI Bastion session
        shell: bash
        env:
          BASTION_NAME: aura-board-devspace-bastion
          SESSION_NAME: aura-board-devspace-auto
          TARGET_PORT: "22"
          MIN_REMAINING_SECONDS: "1200"
          SSH_PUBLIC_KEY_FILE: ${{ runner.temp }}/aura-bastion-session/devspace.pub
          OUTPUT_FILE: ${{ runner.temp }}/aura-bastion-session/session.json
        run: bash infra/oracle/renew-bastion-session.sh

      - name: Publish current session metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-bastion-session
          path: ${{ runner.temp }}/aura-bastion-session/session.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
