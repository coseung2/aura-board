name: Mobile Store Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Store platform to build and submit
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios
      expected_version:
        description: App version that must be present in app.config.ts
        required: true
        default: 1.0.5
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: mobile-store-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release inputs
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5

      - name: Load release secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: 2655fa57-76cd-4dab-bbd2-597bb61051d5
          oidc-audience: https://github.com/coseung2
          project-slug: mobile-release-d-w6g
          env-slug: prod
          secret-path: /aura-board

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Install repository dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Install mobile dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify app identity and version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          npx expo config --json > "$RUNNER_TEMP/expo-config.json"
          node - <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/expo-config.json", "utf8"));
          const expected = process.env.EXPECTED_VERSION;
          const failures = [];
          if (config.version !== expected) failures.push(`version=${config.version}`);
          if (config.android?.package !== "com.auraboard.app") failures.push(`android.package=${config.android?.package}`);
          if (config.ios?.bundleIdentifier !== "com.auraboard.app") failures.push(`ios.bundleIdentifier=${config.ios?.bundleIdentifier}`);
          if (failures.length) throw new Error(`Release identity mismatch: ${failures.join(", ")}`);
          console.log(`Validated Aura Board ${config.version} (${config.android.package}).`);
          NODE

      - name: Run mobile release checks
        run: |
          npm run typecheck
          npm run design:check
          npm run release:check
          npm run assets:check

      - name: Inspect iOS upload archive
        if: ${{ inputs.platform == 'all' || inputs.platform == 'ios' }}
        run: |
          eas build:inspect --platform ios --stage archive --profile production --output "$RUNNER_TEMP/ios-archive" --force
          test -f "$RUNNER_TEMP/ios-archive/apps/mobile/modules/aura-board-health-connect/ios/AuraBoardHealthConnectModule.swift"
          test -f "$RUNNER_TEMP/ios-archive/apps/mobile/modules/aura-board-health-connect/ios/AuraBoardHealthConnect.podspec"

  android:
    name: Android AAB to production
    environment: production
    if: ${{ inputs.platform == 'all' || inputs.platform == 'android' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5

      - name: Load release secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: 2655fa57-76cd-4dab-bbd2-597bb61051d5
          oidc-audience: https://github.com/coseung2
          project-slug: mobile-release-d-w6g
          env-slug: prod
          secret-path: /aura-board

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Install mobile dependencies
        run: npm ci --legacy-peer-deps

      - name: Materialize Firebase Android config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.AURA_BOARD_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          GOOGLE_SERVICES_PATH="$RUNNER_TEMP/google-services.json"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$GOOGLE_SERVICES_PATH"
          chmod 600 "$GOOGLE_SERVICES_PATH"
          node - "$GOOGLE_SERVICES_PATH" <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const packageNames = (config.client ?? []).flatMap((client) => {
            const packageName = client?.client_info?.android_client_info?.package_name;
            return typeof packageName === "string" ? [packageName] : [];
          });
          if (!packageNames.includes("com.auraboard.app")) {
            throw new Error("Firebase config does not belong to com.auraboard.app");
          }
          NODE
          echo "GOOGLE_SERVICES_JSON=$GOOGLE_SERVICES_PATH" >> "$GITHUB_ENV"

      - name: Materialize Google Play service account
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const serviceAccount = process.env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON;
          if (!serviceAccount) throw new Error("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON was not loaded");
          JSON.parse(serviceAccount);
          const output = path.join(process.env.RUNNER_TEMP, "google-play-service-account.json");
          fs.writeFileSync(output, serviceAccount + "\n", { encoding: "utf8", mode: 0o600 });
          const easPath = path.join(process.cwd(), "eas.json");
          const eas = JSON.parse(fs.readFileSync(easPath, "utf8"));
          eas.submit.production.android.serviceAccountKeyPath = output;
          fs.writeFileSync(easPath, JSON.stringify(eas, null, 2) + "\n", { encoding: "utf8", mode: 0o600 });
          NODE

      - name: Build production AAB
        id: build
        run: |
          AAB_PATH="$RUNNER_TEMP/aura-board-${{ inputs.expected_version }}.aab"
          eas build --platform android --profile production --local --output "$AAB_PATH" --non-interactive
          BUILD_NUMBER=$(eas build:version:get --platform android --profile production --non-interactive | sed -n 's/^Android versionCode - //p' | tail -n 1)
          test -s "$AAB_PATH"
          test -n "$BUILD_NUMBER"
          sha256sum "$AAB_PATH"
          echo "aab_path=$AAB_PATH" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Submit AAB to Google Play production
        run: eas submit --platform android --profile production --path "${{ steps.build.outputs.aab_path }}" --wait --non-interactive

      - name: Preserve submitted AAB
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: aura-board-android-${{ inputs.expected_version }}-${{ steps.build.outputs.build_number }}
          path: ${{ steps.build.outputs.aab_path }}
          retention-days: 14

      - name: Write Android summary
        if: always()
        run: |
          {
            echo "## Android production"
            echo "- Commit: $GITHUB_SHA"
            echo "- Version: ${{ inputs.expected_version }}"
            echo "- Version code: ${{ steps.build.outputs.build_number }}"
            echo "- Build: GitHub Ubuntu runner (local EAS build)"
            echo "- Play track: production"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove Google Play service account
        if: always()
        run: rm -f "$RUNNER_TEMP/google-play-service-account.json" "$RUNNER_TEMP/google-services.json"

  ios:
    name: iOS production submission
    environment: production
    if: ${{ inputs.platform == 'all' || inputs.platform == 'ios' }}
    needs: validate
    runs-on: macos-26
    timeout-minutes: 180
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5

      - name: Load release secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: 2655fa57-76cd-4dab-bbd2-597bb61051d5
          oidc-audience: https://github.com/coseung2
          project-slug: mobile-release-d-w6g
          env-slug: prod
          secret-path: /aura-board

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Install mobile dependencies
        run: npm ci --legacy-peer-deps

      - name: Build production IPA
        id: build
        run: |
          IPA_PATH="$RUNNER_TEMP/aura-board-${{ inputs.expected_version }}.ipa"
          eas build --platform ios --profile production --non-interactive --local --output "$IPA_PATH"
          BUILD_NUMBER=$(unzip -p "$IPA_PATH" 'Payload/*.app/Info.plist' | plutil -extract CFBundleVersion raw -o - -)
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Submit IPA to App Store Connect
        run: eas submit --platform ios --profile production --path "${{ steps.build.outputs.ipa_path }}" --wait --non-interactive

      - name: Preserve submitted IPA
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: aura-board-ios-${{ inputs.expected_version }}-${{ steps.build.outputs.build_number }}
          path: ${{ steps.build.outputs.ipa_path }}
          retention-days: 14

      - name: Write iOS summary
        if: always()
        run: |
          {
            echo "## iOS production submission"
            echo "- Commit: $GITHUB_SHA"
            echo "- Version: ${{ inputs.expected_version }}"
            echo "- Build number: ${{ steps.build.outputs.build_number }}"
            echo "- Build: GitHub macOS runner (local EAS build)"
            echo "- Destination: App Store Connect"
          } >> "$GITHUB_STEP_SUMMARY"
