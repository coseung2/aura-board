name: Recover Oracle Services

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-production-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Authorize recovery SSH and inspect host
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - aura-board-prod
    timeout-minutes: 10

    steps:
      - name: Add temporary recovery key
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_user=$(id -un)"
          echo "runner_home=$HOME"
          id
          install -d -m 700 "$HOME/.ssh"
          touch "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          recovery_key='ssh-rsa  aura-console'
          grep -qxF "$recovery_key" "$HOME/.ssh/authorized_keys" || printf '%s\n' "$recovery_key" >> "$HOME/.ssh/authorized_keys"
          systemctl is-active docker.service || true
          systemctl is-active tailscaled.service || true
          test -S /var/run/docker.sock && echo docker_socket=present || echo docker_socket=missing
          sudo -n -l || true
