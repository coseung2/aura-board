services:
  postgres:
    image: postgres:17-alpine
    container_name: aura-board-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aura_board
      POSTGRES_USER: aura_board
      POSTGRES_PASSWORD: aura_board_dev
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura_board -d aura_board"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - aura_board_dev_postgres_data:/var/lib/postgresql/data

volumes:
  aura_board_dev_postgres_data:
    name: aura_board_dev_postgres_data
